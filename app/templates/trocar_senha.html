<!doctype html>
<html lang="pt-br">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trocar senha — Dashboard de Compras CEDEP</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<div class="pagina-auth">
  <div class="caixa-auth">
    <h1>Trocar senha</h1>
    <p class="subtitulo">Senha provisória — defina uma senha nova antes de continuar</p>
    {% if erro %}<p class="erro-form">{{ erro }}</p>{% endif %}
    <form method="post" action="/trocar-senha">
      <label for="senha_atual">Senha atual</label>
      <input type="password" id="senha_atual" name="senha_atual" required autocomplete="current-password">
      <label for="nova_senha">Nova senha</label>
      <input type="password" id="nova_senha" name="nova_senha" required autocomplete="new-password">
      <label for="confirmar">Confirmar nova senha</label>
      <input type="password" id="confirmar" name="confirmar" required autocomplete="new-password">
      <button type="submit">Salvar</button>
    </form>
  </div>
</div>
</body>
</html>
