# vhost do Dashboard de Compras (app_compras_v2).
#
# Versionado aqui; a copia real fica em C:\nginx\conf\compras.conf, colocada
# la por infra\instalar_nginx.ps1 (que tambem acrescenta "include
# compras.conf;" dentro do http{} de C:\nginx\conf\nginx.conf).
#
# Em producao o Vite dev server deixa de existir. O que vai ao ar e o build
# estatico de app/static/v2 (gerado por "npm run build", ver infra\publicar.ps1),
# e ele nao e servido por nada a nao ser este vhost - por isso o nginx serve
# os estaticos direto, e proxia so /api/ para o uvicorn.
#
# HTTPS: nao, por enquanto. Os dois vhosts vizinhos (gestaosac.cdp.lub,
# dre.cdp.lub) sao HTTP na 80, e .cdp.lub e nome interno - nenhuma CA publica
# emite certificado, e um autoassinado faria o celular do Diretor abrir com
# aviso de site nao confiavel (o oposto do objetivo, ja que o celular do
# Diretor e o dispositivo alvo). No dia em que houver certificado para
# *.cdp.lub, troca-se em quatro linhas: acrescentar "listen 443 ssl;" +
# "ssl_certificate" + "ssl_certificate_key" abaixo, e mudar APP_COOKIE_SECURE
# para 1 no .env - TEM que mudar junto, senao o cookie Secure para de ser
# enviado em origem HTTP e toda tela responde 401, parecendo defeito de login.

# --------------------------------------------------------------- <BIND> ---
# Mesma constante de infra\instalar_servico.ps1, MESMO valor - troque as
# duas juntas. nginx nao le variavel de outro arquivo - o valor abaixo, no
# proxy_pass, e o que precisa ser editado a mao quando a hora chegar.
#
# Ja em 127.0.0.1. O orfao de 25/08/2026 (PID 2240, 0.0.0.0:8020) sumiu no
# reinicio de 09/09/2026, como esperado. Mas o taskkill do PID 2508
# (14/09/2026, usado para derrubar os processos antigos) CRIOU um orfao
# novo, preso em 192.168.0.50:8020 - socket sem processo dono (confirmado:
# nao ha PID 2508 vivo) que nao morre sozinho, so em outro reinicio.
#
# Testado em 14/09/2026, antes de instalar: 127.0.0.1 livre, 0.0.0.0 livre,
# 192.168.0.50 ocupado (WinError 10048). Ou seja, o acidente do taskkill ja
# deixou a maquina na configuracao de producao esperada: o uvicorn nao
# consegue mais (nem deve) escutar em 192.168.0.50:8020 direto, e quem
# expoe o app na rede passa a ser este vhost. Se um teste direto contra
# 192.168.0.50:8020 der WinError 10048, e esse orfao antigo - nao defeito
# de configuracao.
server {
    listen 80;
    # Por IP TAMBEM, de proposito: funciona no dia 1, antes de existir o
    # registro DNS de compras.cdp.lub. O nome passa a valer sozinho quando o
    # registro entrar, sem tocar neste arquivo.
    server_name compras.cdp.lub 192.168.0.50;

    # /api/ ANTES de /, ou toda chamada cai no fallback do SPA (location /)
    # e volta HTML onde a tela espera JSON. Mesmo cuidado do vhost dre.cdp.lub.
    location /api/ {
        proxy_pass http://127.0.0.1:8020;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A exportacao de pedido e de lote de preco monta o xlsx em memoria
        # e passa dos 60s padrao. Mesmo motivo do vhost dre.cdp.lub.
        proxy_read_timeout 300s;
    }

    root  C:/Users/Administrator/Desktop/app_compras_v2/app/static/v2;
    index index.html;

    # O react-router usa history (nao hash): /pedidos/41 nao e um arquivo
    # em disco. Sem este fallback, o SEGUNDO carregamento de qualquer tela
    # profunda devolve 404 - o primeiro funciona so porque veio por
    # navegacao interna (clique), nunca por acesso direto na URL / F5.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
