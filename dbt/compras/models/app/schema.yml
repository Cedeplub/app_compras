version: 2

models:
  # ───────────────────────────────────────────────────────────────────────────
  # Camada `app` — o contrato com o dashboard. Projeção pura das três
  # primeiras (Etapa 6); compras_produto_contexto (Etapa 8 do ciclo v2) e
  # compras_ind_fornecedor (Etapa 5) são os dois com join/agregação, e é neles
  # que a regra de CONTEXTO.md §5 exige a CTE final chamada `final`.
  # ───────────────────────────────────────────────────────────────────────────

  - name: compras_pedido
    description: >
      Tabela física COMPRAS_PEDIDO. Projeção PURA de fat_pedido: as mesmas
      122 colunas, na mesma ordem, alias em MAIÚSCULA. Sem cálculo. Grão: 1
      linha por SKU (CODIGO). Ver tests/compras_app_pedido_espelha_fat.sql.
    columns:
      - name: CODIGO
        description: "Grão da tabela: 1 linha por SKU."
        data_tests:
          - unique
          - not_null

  - name: compras_alerta
    description: >
      Tabela física COMPRAS_ALERTA. Projeção PURA de fat_alerta, alias em
      MAIÚSCULA. Grão: 1 linha por SKU x TIPO DE ALERTA ATIVO. ⚠ count(*)
      conta ALERTAS, não PRODUTOS - para produtos é count(distinct CODIGO).
    columns:
      - name: CODIGO
        description: "NÃO é único aqui - o grão é (CODIGO, TIPO_ALERTA)."
        data_tests: [not_null]
      - name: TIPO_ALERTA
        description: >
          ⚠ INTERFACE PÚBLICA, e os valores MUDARAM em 02/09/2026
          (v2/DECISOES_DIRETOR.md item 1). MARGEM_INSTAVEL -> MARGEM_BAIXA,
          MARGEM_INSTAVEL_VAREJO -> MARGEM_BAIXA_VAREJO, PARADO -> SEM_GIRO +
          BAIXO_GIRO, INATIVO removido, OPORTUNIDADE_DE_GIRO e MARGEM_ALTA
          criados. Consulta do dashboard que cite um nome velho volta VAZIA, não
          com erro.
        data_tests:
          - not_null
          - accepted_values:
              values: ['FABRICA', 'RUPTURA', 'DEVOLUCAO', 'SEM_GIRO',
                       'BAIXO_GIRO', 'FORA_DE_LINHA', 'LITRAGEM', 'IMPORTADO',
                       'TRIB', 'MVA', 'CUSTO', 'MARGEM_BAIXA', 'SUCESSAO',
                       'MARGEM_BAIXA_VAREJO', 'OPORTUNIDADE_DE_GIRO',
                       'MARGEM_ALTA']
      - name: TEXTO_ALERTA
        data_tests: [not_null]
      - name: CATEGORIA
        description: >
          'DECISAO' | 'CADASTRO'. A tela de Alertas filtra por 'DECISAO'; a de
          Pendência de Cadastro, por 'CADASTRO'. Indexada junto com TIPO_ALERTA.
        data_tests:
          - not_null
          - accepted_values:
              values: ['DECISAO', 'CADASTRO']
      - name: PONTUA
        description: >
          'S' | 'N' - entra no score de priorização. 'N' em FORA_DE_LINHA (badge
          visual) e em toda a categoria CADASTRO.
        data_tests:
          - not_null
          - accepted_values:
              values: ['S', 'N']

  - name: compras_venda_mensal
    description: >
      Tabela física COMPRAS_VENDA_MENSAL. Projeção PURA de int_venda_mensal,
      alias em MAIÚSCULA. ⚠ Grão: 1 linha por MÊS x PRODUTO - o único model
      da camada `app` cujo grão NÃO é o SKU. O mês corrente está em
      andamento; comparação mês a mês só fecha sobre meses fechados.
    columns:
      - name: MES
        data_tests: [not_null]
      - name: CODIGO_PRODUTO
        data_tests: [not_null]

  - name: compras_produto_contexto
    description: >
      Tabela física COMPRAS_PRODUTO_CONTEXTO. Grão: 1 linha por SKU (CODIGO),
      o mesmo de COMPRAS_PEDIDO. Existe porque as telas de Precificação e
      Decisão do SKU (v2/PLANO.md §2.2) precisam de três campos que NÃO estão
      na aba `pedido` da planilha - e fat_pedido/compras_pedido reproduzem
      aquelas 122 colunas e só elas. É juntada por LEFT JOIN em CODIGO no
      serviço da API, no mesmo molde de COMPRAS_IND_FORNECEDOR. Ver o
      cabeçalho do model para a decisão de zero x nulo em VENDA_ANO_PASSADO.
    columns:
      - name: CODIGO
        description: "Grão da tabela: 1 linha por SKU, o mesmo conjunto de COMPRAS_PEDIDO."
        data_tests:
          - unique
          - not_null
      - name: REGIME_FISCAL
        description: >
          Texto descritivo do regime (dim_tributacao.descricao, aba dICMS),
          buscado pelo COD_ICMS do produto. NULO onde o código não existe na
          tabela de ICMS - os 5 SKUs de codst = 0 que recebem o alerta TRIB.
          Sem valor inventado: ver tests/compras_produto_contexto_regime_segue_modalidade.
      - name: QT_ULT_SAIDA
        description: >
          Quantidade do movimento de saída mais recente do SKU
          (int_cadastro_estoque.qt_ult_saida), par de DT_ULT_SAIDA (AM). NULA
          para SKU sem nenhuma saída registrada - ausência de movimento, não
          quantidade zero. Não é dividida por FATOR_EXIBICAO.
      - name: VENDA_ANO_PASSADO
        description: >
          Quantidade LÍQUIDA vendida no mesmo mês do ano anterior, a barra
          amarela do mini-gráfico (PROTOTIPO.md §2.10). Pode ser NEGATIVA
          (devolução maior que o faturado no mês). ⚠ 0 e NULO significam
          coisas diferentes: 0 é "vendeu zero, com evidência de que o SKU
          estava vivo naquele mês"; NULO é "não há dado". Justificativa e
          números medidos no cabeçalho do model.

  - name: compras_ind_fornecedor
    description: >
      Tabela física COMPRAS_IND_FORNECEDOR. ÚNICO model da camada `app` com
      agregação. Grão: 1 linha por FORNECEDOR (texto do departamento,
      CONTEXTO.md regra 7). Indicador NOVO, sem correspondência na planilha -
      ver o cabeçalho do model para as definições de margem média simples x
      ponderada por estoque. Espinha: dim_fornecedor, left join do agregado
      de fat_pedido - departamento sem SKU sai com contagens zeradas, não some.
    columns:
      - name: FORNECEDOR
        description: "Grão da tabela."
        data_tests:
          - unique
          - not_null

  - name: compras_entrada
    description: >
      Tabela física COMPRAS_ENTRADA (v2 Etapa 10, tela Entradas). Projeção
      PURA de int_entrada_produto, alias em MAIÚSCULA. Grão: 1 linha por item
      de movimento de entrada (ID_TRANSACAO_ITEM). DATA_ENTRADA sai crua - o
      agrupamento Hoje/Ontem/Essa semana/Esse mês é responsabilidade da API,
      usando a data REAL da consulta (ver cabeçalho do model).
    columns:
      - name: ID_TRANSACAO_ITEM
        data_tests: [unique, not_null]
      - name: TIPO_ENTRADA
        data_tests:
          - accepted_values:
              values: ['COMPRA', 'BONIFICACAO']

  - name: compras_monitoramento
    description: >
      Tabela física COMPRAS_MONITORAMENTO (v2 Etapa 10, tela Monitoramento).
      Projeção PURA de int_venda_diaria, alias em MAIÚSCULA. Grão: DIA x
      CODIGO_PRODUTO, cobrindo compras_monitoramento_dias_historico dias.
      Não tem período pré-agregado - ver o cabeçalho do model para as três
      decisões que a API precisa conhecer (semana ISO/segunda, comparação
      parcial-contra-parcial via DATA_REFERENCIA, peso/litros aproximados).
    columns:
      - name: DIA
        data_tests: [not_null]
      - name: CODIGO_PRODUTO
        data_tests: [not_null]
