name: 'compras'
version: '1.0.0'
config-version: 2

profile: 'compras'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

# Materializacao centralizada aqui. {{ config() }} por arquivo so para DESVIO -
# e desvio pede comentario explicando o porque, no cabecalho do model.
models:
  compras:
    staging:
      +materialized: view

    intermediate:
      +materialized: table

    marts:
      +materialized: table

    # Camada de CONTRATO com o dashboard. O nome do arquivo E o nome fisico da
    # tabela que a aplicacao le, e os aliases saem em MAIUSCULAS.
    # Renomear coluna aqui quebra o dashboard - trate como interface publica.
    app:
      +materialized: table
      +tags: ['app']

# Janela de historico da venda mensal, em meses contados para tras a partir do
# mes corrente.
#
# 96 desde 05/10/2026 (era 24, que cobria "ano anterior completo + ano corrente",
# documentacao tecnica v10 secao 4.2). Pedido do usuario: a tela Monitoramento
# oferece Dia/Semana/Mes/Ano (web/src/periodo.js) e "Ano" nao conseguia voltar
# mais de um ano - nao por falta de dado no ERP (o CEDEP tem historico desde
# 06/2013), mas porque o dbt nao o trazia. 96 meses alcancam 11/2018 hoje.
#
# Por que JANELA MOVEL, e nao o piso fixo em 01/01/2019 que foi o pedido literal:
#   1. mantem a doutrina deste bloco (logo abaixo) - "os N meses que terminam no
#      mes corrente" - em vez de uma janela que cresce sozinha para sempre;
#   2. volume e custo ficam estaveis no tempo;
#   3. e o que mantem data_inicio e qtd_meses saindo da MESMA var. Com piso
#      fixo, qtd_meses viraria um literal desacoplado, e n_fechados
#      (= qtd_meses - 1, em int_venda_mensal_pivot.sql e _sucessao.sql) poderia
#      cair abaixo de 12 sem ninguem perceber: MED12 vira NULL, MEDIA_JANELA
#      vira 0 (int_produto_demanda.sql) e a sugestao de compra passa a pedir a
#      menos, em silencio.
# Consequencia aceita: em 2028 a janela alcanca 01/2021, nao mais 2019.
#
# Custo MEDIDO antes de decidir (nucleo dos dois models mais pesados, 24 -> 96):
#   int_faturamento_mensal       34,1s -> 39,1s  (+15%)
#   int_dias_sem_estoque_mensal  32,6s -> 33,9s  (+4%)
# O peso esta na varredura do PCMOV/PCHISTEST, que acontece com qualquer janela;
# o filtro de data quase nao muda o plano de execucao. Tambem foi medido que nao
# existe um unico mes sem faturamento valido nos 96 - o teste
# compras_janela_mensal_coerente, que exige cobertura COMPLETA, continua passando.
#
# Sobre depender do dia: a janela DESTE projeto e' "os N meses que terminam no mes
# corrente" - e' o contrato do relatorio, entao depender da data e' correto e a macro
# compras_periodo_mensal faz isso de proposito. O que se rejeita do filtro_periodo do
# powerbi_dbt e' outra coisa: "hoje" como DEFAULT SILENCIOSO de um parametro que
# deveria ser explicito. A diferenca e' intencao declarada versus efeito colateral.
vars:
  compras_meses_historico: 96

  # Filial de estoque usada pelo relatorio de posicao (query.py) e pela coluna
  # de dias sem estoque do relatorio mensal (query_mensal.py). ATENCAO: o codigo
  # e '2', SEM ZERO A ESQUERDA - PCEST.CODFILIAL e PCFILIAL.CODIGO sao VARCHAR2(2)
  # e guardam '1'/'2'/'9', nao '01'/'02'/'09' (CONTEXTO.md regra 3).
  compras_filial_estoque: '2'

  # UF de destino usada no ON do join com pctabtrib (nunca no WHERE - no WHERE
  # descartaria produto sem linha de tributacao para a UF).
  compras_uf_destino: 'BA'

  # v2 Etapa 10 (tela Entradas). Em MESES, alinhado ao mes corrente, igual a
  # compras_meses_historico e a compras_monitoramento_meses_historico - ver
  # int_entrada_compra.sql.
  #
  # Era `compras_entrada_dias_historico: 180` ate 08/10/2026, justificado por
  # "a tela agrupa so em Hoje/Ontem/Essa semana/Esse mes, com navegacao
  # Dia/Semana/Mes, SEM Ano". A premissa estava ERRADA: a tela Entradas usa o
  # MESMO componente SeletorPeriodo das demais (web/src/componentes/
  # SeletorPeriodo.jsx), que renderiza as quatro granularidades de
  # GRANULARIDADES - Ano inclusive. Nunca existiu versao da tela sem "Ano"; o
  # comentario descrevia o prototipo, nao o que foi construido. Com 180 dias,
  # escolher "Ano" e voltar um periodo devolvia tela vazia - mesmo defeito que
  # a janela diaria do Monitoramento tinha em 05/10/2026.
  #
  # Medido em 08/10/2026: 12.006 itens de entrada em 180 dias contra 196.999 em
  # 96 meses (4.837 produtos distintos, desde 11/2018). E uma tabela pequena -
  # COMPRAS_MONITORAMENTO tem 2,0 milhoes de linhas - e o build de
  # int_entrada_compra com a janela nova levou 5,1s. Ver o cabecalho do model
  # para por que o micro-benchmark feito fora do dbt (10s -> 75s) nao valia.
  compras_entrada_meses_historico: 96

  # v2 Etapa 10 (tela Monitoramento), grao DIARIO
  # (int_venda_diaria/COMPRAS_MONITORAMENTO). Em MESES, alinhado ao mes corrente,
  # igual a compras_meses_historico - ver int_periodo_diario.sql.
  #
  # Era `compras_monitoramento_dias_historico: 400` ate 05/10/2026, com a
  # justificativa de que "comparacao de Mes/Ano usa COMPRAS_VENDA_MENSAL, grao
  # diario nao precisa alcancar a mesma janela". Isso estava ERRADO na pratica:
  # o backend (app/servicos/monitoramento.py) recebe `de`/`ate` da tela e soma
  # COMPRAS_MONITORAMENTO para TODAS as granularidades, Ano inclusive - nunca
  # houve caminho que lesse COMPRAS_VENDA_MENSAL (que, alias, nao tem leitor
  # nenhum e nem tem as colunas de peso/litragem que a tela usa). Resultado: com
  # 400 dias, "Ano" voltava um ano e mostrava tela vazia.
  #
  # Mesmo valor que compras_meses_historico de proposito: as duas janelas
  # comecam no mesmo mes, que e o que o teste compras_venda_diaria_bate_mensal
  # ja assume ao reconciliar diario x mensal so em meses completos. Medido:
  # COMPRAS_MONITORAMENTO passa de ~339 mil para ~2,0 milhoes de linhas.
  compras_monitoramento_meses_historico: 96

# ─────────────────────────────────────────────────────────────────────────────
# Seeds - as tabelas de apoio, extraidas das abas da planilha v10.
#
# +column_types explicito onde a coluna e ESPARSA: o dbt-oracle infere o tipo a
# partir das primeiras linhas, e coluna quase toda nula vira o tipo errado.
# ─────────────────────────────────────────────────────────────────────────────
seeds:
  compras:
    +delimiter: ";"

    # VALOR guarda numero E texto na mesma coluna (MEDIDA_PEDIDO = 'LITROS'),
    # entao e VARCHAR2 e a conversao acontece no model int_parametro.
    # ATIVO='N' marca parametro que a propria planilha declara sem efeito -
    # estao aqui como registro historico e NAO devem ser usados em calculo.
    seed_parametros:
      +column_types:
        PARAMETRO: VARCHAR2(40)
        VALOR: VARCHAR2(40)
        ATIVO: VARCHAR2(1)
        OBS: VARCHAR2(400)

    seed_fornecedor:
      +column_types:
        FORNECEDOR: VARCHAR2(60)
        MESES_MEDIA: NUMBER(3)
        COBERTURA_ALVO: NUMBER(6,2)
        PEDIDO_EM: VARCHAR2(10)
        COMPRADOR: VARCHAR2(40)

    # MVA e nula em 6 das 15 linhas (so ST_SUBSTITUTO tem MVA) - o caso classico
    # de inferencia errada.
    seed_icms:
      +column_types:
        COD_TRIBUTACAO: NUMBER(6)
        DESCRICAO: VARCHAR2(120)
        MODALIDADE: VARCHAR2(20)
        MVA: NUMBER(12,8)
        ALIQ_ICMS_SAIDA: NUMBER(12,8)
        REDUCAO_BASE: NUMBER(12,8)
        ICMS_EF_SAIDA: NUMBER(12,8)
        ICMS_EF_SEM_REDUCAO: NUMBER(12,8)

    seed_icms_origem:
      +column_types:
        UF_ORIGEM: VARCHAR2(2)
        ALIQ_ICMS_COMPRA: NUMBER(12,8)

    seed_credito:
      +column_types:
        FORNECEDOR: VARCHAR2(60)
        COD_ICMS: NUMBER(6)
        CREDITO: NUMBER(12,8)

    seed_piscofins:
      +column_types:
        CODTRIBPISCOFINS: NUMBER(6)
        DESCRICAO: VARCHAR2(60)
        ALIQ_EFETIVA: NUMBER(12,8)

    seed_embalagem:
      +column_types:
        EMBALAGEM: VARCHAR2(40)
        UNID_POR_EMB: NUMBER(12,4)
        LITROS_POR_EMB: NUMBER(12,4)
        LITROS_POR_UNIDADE: NUMBER(12,4)

    # ANTIGO_2/PESO_2 sao nulos em praticamente toda linha (caso de duas trocas
    # em sequencia, raro).
    seed_sucessao:
      +column_types:
        CODIGO_NOVO: NUMBER(6)
        ANTIGO_1: NUMBER(6)
        PESO_1: NUMBER(9,6)
        ANTIGO_2: NUMBER(6)
        PESO_2: NUMBER(9,6)
        ATIVO: VARCHAR2(3)

    seed_est_fabrica:
      +column_types:
        COD_FAB: VARCHAR2(40)
        DESCRICAO: VARCHAR2(120)
        DISPONIVEL: NUMBER(14,4)
        UN: VARCHAR2(10)
        LOCAL: VARCHAR2(40)
        FORNECEDOR: VARCHAR2(60)
